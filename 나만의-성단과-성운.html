<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>나만의 성단과 성운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#05081A;
  --deep:#0B1030;
  --panel:rgba(20,28,64,0.62);
  --panel-solid:#141C40;
  --line:rgba(150,168,230,0.22);
  --line-strong:rgba(168,150,255,0.55);
  --star:#EEF2FF;
  --text:#E7ECFF;
  --muted:#9FAAD6;
  --dim:#7C87B4;
  --violet:#9B7BFF;
  --violet-deep:#6B46E5;
  --lav:#C9B8FF;
  --cyan:#6FE3F2;
  --rose:#F58CC0;
  --ok:#68E0B0;
  --shadow:0 18px 50px rgba(2,4,20,0.55);
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:var(--text);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:17px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}

/* ---------- background ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{width:100%;height:100%;display:block}
.glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(60px);opacity:.5}
.glow.a{width:min(70vw,620px);aspect-ratio:1;left:-14vw;top:-12vh;background:radial-gradient(circle,rgba(107,70,229,.55),transparent 66%)}
.glow.b{width:min(62vw,540px);aspect-ratio:1;right:-16vw;top:34vh;background:radial-gradient(circle,rgba(111,227,242,.24),transparent 66%)}
.glow.c{width:min(80vw,700px);aspect-ratio:1;left:10vw;bottom:-28vh;background:radial-gradient(circle,rgba(245,140,192,.20),transparent 66%)}

/* ---------- top progress ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:linear-gradient(180deg,rgba(5,8,26,.96),rgba(5,8,26,.72) 70%,rgba(5,8,26,0));
  padding:12px 16px 16px;
  backdrop-filter:blur(6px);
}
.rail{height:4px;border-radius:99px;background:rgba(150,168,230,.18);overflow:hidden}
.rail-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet-deep),var(--violet) 55%,var(--cyan));transition:width .45s cubic-bezier(.4,0,.2,1)}
.topmeta{display:flex;align-items:baseline;gap:10px;margin-top:9px;flex-wrap:wrap}
.stepnum{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;color:var(--lav)}
.steplabel{font-size:14px;color:var(--dim)}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:10;max-width:760px;margin:0 auto;padding:0 18px 72px}
.screen{padding-block:14px 0;animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
  .rail-fill{transition:none}
}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
h2.q{font-family:'Gowun Batang',serif;font-size:clamp(23px,5.4vw,30px);font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin-top:10px;font-size:16px}
.note{font-size:14px;color:var(--dim);line-height:1.6}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---------- option cards ---------- */
.opt{
  position:relative;display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);
  padding:16px 18px 16px 15px;cursor:pointer;
  transition:border-color .18s,background .18s,transform .18s;
  backdrop-filter:blur(8px);
}
.opt:hover{border-color:var(--line-strong);background:rgba(30,40,88,.7)}
.opt:active{transform:scale(.988)}
.opt .mark{
  flex:0 0 26px;height:26px;margin-top:1px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);transition:.18s;
}
.opt .txt{flex:1;min-width:0}
.opt .t{font-weight:500;line-height:1.5}
.opt .d{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.opt[aria-pressed="true"]{border-color:var(--violet);background:rgba(107,70,229,.26);box-shadow:0 0 0 1px var(--violet) inset}
.opt[aria-pressed="true"] .mark{background:var(--violet);border-color:var(--violet);color:#0B0720;font-weight:700}
.opt[aria-pressed="true"] .mark::after{content:"✓"}
.opt[aria-pressed="true"] .mark span{display:none}
:is(button,a,input,textarea,select):focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}

/* mbti grid */
.mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media (max-width:560px){.mbti{grid-template-columns:repeat(2,1fr)}}
.mbti .opt{justify-content:center;padding:14px 8px;flex-direction:column;align-items:center;gap:4px}
.mbti .opt .t{font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;font-size:16.5px;font-weight:500}
.mbti .opt .mark{display:none}
.mbti .opt[aria-pressed="true"] .t::after{content:" ✓";color:var(--cyan)}
.wide{margin-top:12px}
.wide .opt{justify-content:center;text-align:center}
.wide .opt .mark{display:none}
.wide .opt[aria-pressed="true"] .t::after{content:" ✓";color:var(--cyan)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:16px 26px;border-radius:14px;border:1.5px solid transparent;cursor:pointer;
  font-weight:600;font-size:17px;transition:.18s;text-decoration:none;
}
.btn.primary{background:linear-gradient(135deg,var(--violet-deep),var(--violet));color:#fff;box-shadow:0 10px 30px rgba(107,70,229,.42)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--line-strong);color:var(--text)}
.btn.copy{background:linear-gradient(135deg,#0E7C8C,var(--cyan));color:#04121A;width:100%;font-size:18px;padding:18px 20px;box-shadow:0 10px 30px rgba(111,227,242,.24)}
.btn.copy:hover{filter:brightness(1.08)}
.btn.copy.done{background:linear-gradient(135deg,#14855F,var(--ok));color:#03150E}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{width:100%;padding:20px;font-size:19px}
.navrow{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.navrow .btn.ghost{padding:14px 20px;font-size:16px}
.spacer{flex:1}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(8px)}
.card h3{font-family:'Gowun Batang',serif;font-size:20px;margin-bottom:8px}
.card .sci{font-size:15px;color:var(--muted)}
.subcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:520px){.subcards{grid-template-columns:1fr}}
.subcard{background:rgba(9,14,38,.6);border:1px solid var(--line);border-radius:13px;padding:14px}
.subcard b{display:block;font-size:15.5px;color:var(--lav);margin-bottom:4px}
.subcard span{font-size:14.5px;color:var(--muted);line-height:1.55}

/* ---------- form ---------- */
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
@media (max-width:560px){.fields{grid-template-columns:repeat(2,1fr)}.fields .f-name{grid-column:1/-1}}
.field label{display:block;font-size:14px;color:var(--lav);margin-bottom:7px;letter-spacing:.02em}
.field input,.field select{
  width:100%;padding:14px 12px;font-size:17px;border-radius:12px;
  background:rgba(9,14,38,.75);border:1.5px solid var(--line);color:var(--text);
  font-family:inherit;
}
.field input:focus,.field select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(155,123,255,.25)}
.field .unit{color:var(--dim);font-size:13px;margin-left:4px}
.preview{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--cyan);min-height:24px}

textarea{
  width:100%;min-height:190px;padding:16px;font-size:16.5px;line-height:1.75;border-radius:14px;
  background:rgba(9,14,38,.75);border:1.5px solid var(--line);color:var(--text);
  font-family:inherit;resize:vertical;
}
textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(155,123,255,.25)}

/* ---------- result ---------- */
.dna{
  margin-top:22px;border-radius:22px;padding:26px 22px;
  background:linear-gradient(160deg,rgba(28,22,72,.9),rgba(10,14,40,.9));
  border:1px solid var(--line-strong);box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.dna::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:70%;background:radial-gradient(ellipse at 50% 0,rgba(155,123,255,.4),transparent 70%);pointer-events:none}
.dna .type{position:relative;font-family:'Gowun Batang',serif;font-size:clamp(25px,6.2vw,34px);font-weight:700;line-height:1.35;text-wrap:balance}
.dna .sum{position:relative;margin-top:14px;color:var(--lav);font-size:16px;line-height:1.75}
.rows{position:relative;margin-top:22px;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:146px 1fr;gap:12px;background:rgba(8,12,34,.86);padding:13px 15px;align-items:baseline}
@media (max-width:440px){.row{grid-template-columns:1fr;gap:2px}}
.row dt{font-size:14px;color:var(--dim);letter-spacing:.02em}
.row dd{margin:0;font-size:16px;font-weight:500}
.hintline{margin-top:14px;font-size:13.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace;line-height:1.7}

/* ---------- prompt box ---------- */
.promptbox{
  margin-top:18px;background:rgba(6,10,28,.88);border:1px solid var(--line);border-left:3px solid var(--cyan);
  border-radius:14px;padding:20px;white-space:pre-wrap;word-break:break-word;
  font-size:16px;line-height:1.85;color:#DCE4FF;
}
.copywrap{margin-top:14px}
.toast{margin-top:10px;font-size:15px;color:var(--ok);min-height:22px}
.tip{margin-top:16px;font-size:14.5px;color:var(--dim);line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{background:rgba(155,123,255,.16);border:1px solid var(--line-strong);color:var(--lav);border-radius:99px;padding:9px 16px;font-size:15px;cursor:pointer}
.chip:hover{background:rgba(155,123,255,.3);color:#fff}

.finale{text-align:center;padding-block:30px}
.finale h2{font-family:'Gowun Batang',serif;font-size:clamp(28px,7vw,38px)}
.finale p{color:var(--muted);margin-top:18px;line-height:1.9;font-size:16.5px}
.finale .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}

.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,5,18,.86);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.overlay .box{background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.overlay img{width:100%;border-radius:12px;display:block;margin-bottom:14px}
.overlay .note{margin-bottom:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<div id="sky"><canvas id="stars"></canvas></div>
<div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>

<header class="topbar" id="topbar" hidden>
  <div class="rail"><div class="rail-fill" id="railFill"></div></div>
  <div class="topmeta">
    <span class="stepnum" id="stepNum">STEP 1 / 8</span>
    <span class="steplabel" id="stepLabel">우주 탐험 시작하기</span>
  </div>

<div class="wrap"><main id="app" aria-live="polite"></main></div>

/* MBTI → 시각적 표현 요소 (성격 판정이 아니라 그림의 스타일 참고값) */
const AXIS = {
  E:{light:'바깥으로 넓게 확장되는 느낌', key:'확장되는 빛'},
  I:{light:'중심에 응축되어 깊이가 느껴지는 느낌', key:'응축된 빛'},
  S:{detail:'별과 가스, 먼지의 구조가 비교적 또렷하게 보이는 표현', key:'또렷한 구조'},
  N:{detail:'몽환적이고 상상력이 강조된 표현', key:'몽환적 표현'},
  T:{line:'선명한 대비와 구조적인 형태', key:'선명한 대비'},
  F:{line:'부드럽게 이어지는 색과 유기적인 곡선', key:'유기적 곡선'},
  J:{form:'균형이 잡힌 안정된 구성', key:'안정된 구성'},
  P:{form:'비대칭적이고 자유로운 구성', key:'자유로운 구성'}
};
const MBTI_LIST = ['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'];

/* =========================================================
   2. 조사 처리 유틸
   ========================================================= */
function jong(w){
  if(!w) return 0;
  const c = w.charCodeAt(w.length-1);
  if(c < 0xAC00 || c > 0xD7A3) return -1;
  return (c - 0xAC00) % 28;
}
function josa(w, withJong, without){
  const j = jong(w);
  if(j === -1) return w + without;
  return w + (j ? withJong : without);
}
function josaRo(w){ // 으로 / 로
  const j = jong(w);
  if(j === -1 || j === 0 || j === 8) return w + '로';
  return w + '으로';
}

const KEY = 'myUniverse_v1';
const S = {
  studentGrade:'3', studentClass:'', studentNumber:'', studentName:'',
  mbti:'', mbtiKnown:null,
  axes:{EI:'', SN:'', TF:'', JP:''},
  selectedColor:null, valueId:null, starRoleId:null, energyId:null, moodId:null, feelingId:null,
  spaceObject:null,
  artworkTitle:'', artworkDescription:'', descTouched:false,
  screen:'intro', qi:0
};
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || typeof o !== 'object') return false;
    Object.assign(S, o);
    return true;
  }catch(e){ return false; }
}
function reset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  Object.assign(S, {
    studentGrade:'3', studentClass:'', studentNumber:'', studentName:'',
    mbti:'', mbtiKnown:null, axes:{EI:'',SN:'',TF:'',JP:''},

    spaceObject:null, artworkTitle:'', artworkDescription:'', descTouched:false, screen:'intro', qi:0

/* =========================================================
   4. 결과 종합 로직
   ========================================================= */
function pick(arr, id){ return arr.find(x => x.id === id) || null; }
function axesOf(){
  if(S.mbti && MBTI_LIST.includes(S.mbti)){
    return {EI:S.mbti[0], SN:S.mbti[1], TF:S.mbti[2], JP:S.mbti[3]};
  }
  return {EI:S.axes.EI||'E', SN:S.axes.SN||'N', TF:S.axes.TF||'F', JP:S.axes.JP||'P'};
}
function ready(){
  return S.selectedColor && S.valueId && S.starRoleId && S.energyId && S.moodId && S.feelingId;
}
function R(){
  const c = pick(COLORS, S.selectedColor);
  const v = pick(VALUES, S.valueId);
  const r = pick(STARROLES, S.starRoleId);
  const e = pick(ENERGY, S.energyId);
  const m = pick(MOODS, S.moodId);
  const f = pick(FEELINGS, S.feelingId);
  const ax = axesOf();
  const obj = S.spaceObject ? OBJECTS[S.spaceObject] : null;

  const typeName = e.short + ' ' + c.short + ' ' + v.persona;
  /* 느낌/상징 = 질문3 + 질문7 */
  const symbol = v.text + ', 그리고 내 작품을 보는 사람이 ' + f.name + '을 받았으면 하는 마음';
  /* 분위기 = 질문6 + MBTI 시각 요소 / 형태 = 질문5 + E·I, J·P */
  const lightPhrase = AXIS[ax.EI].light;
  const formPhrase  = AXIS[ax.JP].form;
  const detailPhrase= AXIS[ax.SN].detail;
  const linePhrase  = AXIS[ax.TF].line;
  const keys = [AXIS[ax.EI].key, AXIS[ax.SN].key, AXIS[ax.TF].key, AXIS[ax.JP].key];

  const summary = c.light + '을 내며 ' + e.text + ' ' + (obj ? obj.name : '우주') +
    '. ' + josa(v.name,'을','를') + ' 상징하고, ' + m.adj + ' 분위기를 담고 있음.';

  return {c,v,r,e,m,f,ax,obj,typeName,symbol,lightPhrase,formPhrase,detailPhrase,linePhrase,keys,summary};
}

  if(!x.obj) return '';
  return [
    '나는 ' + x.obj.long + '을 나만의 모습으로 표현하였다.',
    x.c.family + ' 계열의 빛은 ' + josa(x.v.text,'을','를') + ' 상징한다.',
    x.e.text + ' 모습은 ' + x.r.text + ' 나의 모습을 나타낸다.',
    '나는 이 작품이 ' + x.m.adj + ' 느낌으로 보이기를 바랐다.',
    '내 작품을 본 사람도 ' + x.f.name + '을 받았으면 좋겠다.'
  ].join(' ');
}

function buildTitles(){
  const x = R();
  const on = x.obj ? x.obj.name : '우주';
  const pool = [
    x.c.short + ' ' + x.v.name.split('과 ')[0],
    x.e.short + ' ' + on,
    '나를 닮은 ' + on,
    x.c.short + '의 ' + x.v.persona,
    x.m.adj + ' ' + on,
    x.v.name.split('과 ')[1] + '의 ' + on,
    x.e.short + ' ' + x.c.short
  ];
  const out = [];
  for(const t of pool){ if(!out.includes(t)) out.push(t); if(out.length===3) break; }
  return out;
}

function answerOf(qid){
  switch(qid){
    case 'q1': return S.mbtiKnown === false ? '__unknown__' : (S.mbti || null);
    case 'qA': return S.axes.EI ? (S.axes.EI==='E'?1:2) : null;
    case 'qB': return S.axes.SN ? (S.axes.SN==='S'?1:2) : null;
    case 'qC': return S.axes.TF ? (S.axes.TF==='T'?1:2) : null;
    case 'qD': return S.axes.JP ? (S.axes.JP==='J'?1:2) : null;
    case 'q2': return S.selectedColor;
    case 'q3': return S.valueId;
    case 'q4': return S.starRoleId;
    case 'q5': return S.energyId;
    case 'q6': return S.moodId;
    case 'q7': return S.feelingId;
  }
  return null;
}
function setAnswer(qid, val){
  switch(qid){
    case 'qA': S.axes.EI = val===1?'E':'I'; break;
    case 'qB': S.axes.SN = val===1?'S':'N'; break;
    case 'qC': S.axes.TF = val===1?'T':'F'; break;
    case 'qD': S.axes.JP = val===1?'J':'P'; break;
    case 'q2': S.selectedColor = val; break;
    case 'q3': S.valueId = val; break;
    case 'q4': S.starRoleId = val; break;
    case 'q5': S.energyId = val; break;
    case 'q6': S.moodId = val; break;
    case 'q7': S.feelingId = val; break;
  }
  save();
}

function go(screen, qi){
  S.screen = screen;
  if(typeof qi === 'number') S.qi = qi;
  save();
  render();
  window.scrollTo(0, 0);
}
function updateBar(){
  const st = STEPS[S.screen];
  topbar.hidden = (S.screen === 'intro');
  stepNum.textContent = 'STEP ' + st.n + ' / 8';
  stepLabel.textContent = st.label;
  let p;
  if(S.screen === 'quiz'){
    const qs = questions();
    p = (2 + Math.min(S.qi, qs.length) / qs.length) / 8;
  }else if(S.screen === 'concept'){
    p = 2 / 8;
  }else{
    p = st.n / 8;
  }
  if(S.screen === 'done') p = 1;
  railFill.style.width = Math.max(4, p * 100) + '%';
}

/* 요소 생성 헬퍼 */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function optionButton(text, desc, index, selected, onClick){
  const b = el('button','opt');
  b.type = 'button';
  b.setAttribute('aria-pressed', selected ? 'true' : 'false');
  const mark = el('span','mark');
  mark.appendChild(el('span','', String(index)));
  const txt = el('span','txt');
  txt.appendChild(el('span','t', text));
  if(desc) txt.appendChild(el('span','d', desc));
  b.appendChild(mark); b.appendChild(txt);
  b.addEventListener('click', onClick);
  return b;
}
function navRow(backFn, nextLabel, nextFn, nextEnabled){
  const row = el('div','navrow');
  if(backFn){
    const b = el('button','btn ghost','← 이전');
    b.type='button'; b.addEventListener('click', backFn); row.appendChild(b);
  }
  row.appendChild(el('div','spacer'));
  if(nextLabel){
    const n = el('button','btn primary', nextLabel);
    n.type='button';
    if(nextEnabled === false) n.disabled = true;
    n.addEventListener('click', nextFn);
    row.appendChild(n);
  }
  return row;
}

function screenQuiz(){
  const qs = questions();
  if(S.qi >= qs.length){ return screenResult(); }
  const q = qs[S.qi];
  const s = el('section','screen');
  s.appendChild(el('div','eyebrow', '나는 어떤 우주일까? · 질문 ' + (S.qi+1) + ' / ' + qs.length));
  s.appendChild(el('h2','q', q.title));
  if(q.lead) s.appendChild(el('p','lead', q.lead));

  const cur = answerOf(q.id);
  const advance = ()=>{ setTimeout(()=>{
    const list = questions();
    if(S.qi + 1 >= list.length) go('result');
    else go('quiz', S.qi + 1);
  }, 240); };

  if(q.variant === 'mbti'){
    const grid = el('div','mbti');
    MBTI_LIST.forEach(m=>{
      const b = optionButton(m, null, 0, cur === m, ()=>{
        S.mbti = m; S.mbtiKnown = true;
        S.axes = {EI:m[0], SN:m[1], TF:m[2], JP:m[3]};
        save(); render(); advance();
      });
      grid.appendChild(b);
    });
    s.appendChild(grid);
    const wide = el('div','wide');
    wide.appendChild(optionButton('잘 모르겠어요', null, 0, cur === '__unknown__', ()=>{
      S.mbti = ''; S.mbtiKnown = false;
      save(); render(); advance();
    }));
    s.appendChild(wide);
    if(q.foot){
      const f = el('p','note'); f.style.marginTop='18px'; f.textContent = q.foot;
      s.appendChild(f);
    }
  }else{
    const box = el('div', q.options.length > 3 ? 'grid2' : 'stack');
    q.options.forEach((o, i)=>{
      const val = o.id !== undefined ? o.id : (i+1);
      box.appendChild(optionButton(o.t, o.d, i+1, cur === val, ()=>{
        setAnswer(q.id, val); render(); advance();
      }));
    });
    s.appendChild(box);
  }

  const back = ()=>{ if(S.qi === 0) go('concept'); else go('quiz', S.qi - 1); };
  s.appendChild(navRow(back, null, null));
  return s;
}

    b5.textContent = '저장 중…';
    const r = await saveFile(name, buildSummaryText(), 'text/plain;charset=utf-8');
    b5.textContent = r === 'saved' ? '저장했어요!' : (r === 'declined' ? '저장을 취소했어요' : '저장이 안 돼요 — 복사를 이용하세요');
    setTimeout(()=>{ b5.textContent = '요약 파일로 저장'; }, 2600);
  });
  extra.appendChild(b3); extra.appendChild(b4); extra.appendChild(b5);
  s.appendChild(extra);

  const n = el('p','note');

  s.appendChild(n);

}

/* =========================================================
   8. 복사 / 저장
   ========================================================= */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyBlock(text, label, doneMsg){
  const wrap = el('div','copywrap');
  const b = el('button','btn copy', label);
  b.type = 'button';
  const toast = el('p','toast');
  b.addEventListener('click', async ()=>{
    const ok = await copyText(text);
    if(ok){
      b.classList.add('done');
      b.textContent = '✓ 복사했어요';
      toast.textContent = doneMsg;
      setTimeout(()=>{ b.classList.remove('done'); b.textContent = label; }, 3000);
    }else{
      toast.style.color = 'var(--rose)';
      toast.textContent = '복사가 되지 않았어요. 프롬프트 글자를 직접 드래그해서 복사해 주세요.';
    }
  });
  wrap.appendChild(b); wrap.appendChild(toast);
  return wrap;
}
/* 게시된 페이지에서는 claude 런타임의 downloads 기능을,
   파일로 직접 열었을 때는 일반 다운로드를 사용합니다. */
let _dlNs;
async function downloadsNs(){
  if(_dlNs !== undefined) return _dlNs;
  _dlNs = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      _dlNs = await window.claude.use('downloads');
    }
  }catch(e){ _dlNs = null; }
  return _dlNs;
}
async function saveFile(filename, data, mime){
  const ns = await downloadsNs();
  if(ns && ns.save){
    try{ await ns.save({filename, data}); return 'saved'; }
    catch(e){ return (e && e.code === 'declined') ? 'declined' : 'fail'; }
  }
  try{
    const blob = (data instanceof Blob) ? data : new Blob([data], {type: mime || 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return 'saved';
  }catch(e){ return 'fail'; }
}
function dataUrlToBlob(u){
  const [head, b64] = u.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* ---- 결과 카드 이미지 ---- */
function wrapText(ctx, text, x, y, maxW, lh){
  const words = String(text).split('');
  let line = '', yy = y;
  for(const ch of words){
    if(ctx.measureText(line + ch).width > maxW && line){
      ctx.fillText(line, x, yy); line = ch; yy += lh;
    }else line += ch;
  }
  if(line) ctx.fillText(line, x, yy);
  return yy + lh;
}
async function drawCard(){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const W = 1080, H = 1660;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const x = R();

  g.fillStyle = '#05081A'; g.fillRect(0,0,W,H);
  let rg = g.createRadialGradient(W*0.5, H*0.18, 40, W*0.5, H*0.18, W*0.95);
  rg.addColorStop(0, x.c.grad[1] + 'AA');
  rg.addColorStop(0.45, x.c.grad[0] + '44');
  rg.addColorStop(1, 'rgba(5,8,26,0)');
  g.fillStyle = rg; g.fillRect(0,0,W,H);
  for(let i=0;i<260;i++){
    const sx = Math.random()*W, sy = Math.random()*H, r = Math.random()*1.9+0.3;
    g.globalAlpha = Math.random()*0.75 + 0.2;
    g.fillStyle = '#FFFFFF';
    g.beginPath(); g.arc(sx,sy,r,0,Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  g.strokeStyle = 'rgba(180,190,255,.35)'; g.lineWidth = 3;
  g.strokeRect(40,40,W-80,H-80);

  const L = 96, maxW = W - 192;
  g.textBaseline = 'top';
  g.fillStyle = '#9FE8F5';
  g.font = '500 30px "IBM Plex Mono", monospace';
  g.fillText('MY  UNIVERSE  DNA', L, 118);

  g.fillStyle = '#FFFFFF';
  g.font = '700 74px "Gowun Batang", serif';
  let y = wrapText(g, x.typeName, L, 178, maxW, 92);

  g.fillStyle = '#C9B8FF';
  g.font = '400 32px "IBM Plex Sans KR", sans-serif';
  y = wrapText(g, x.summary, L, y + 18, maxW, 48) + 26;

  const rows = [
    ['대표 색', x.c.name],
    ['나를 나타내는 가치', x.v.name],
    ['에너지의 움직임', x.e.name],
    ['우주의 분위기', x.m.name],
    ['우주 속 나의 모습', x.r.name],
    ['작품이 주는 느낌', x.f.name],
    ['선택한 천체', x.obj ? x.obj.name : '-']
  ];
  for(const [k,v] of rows){
    g.fillStyle = 'rgba(10,16,44,.72)';
    g.fillRect(L, y, maxW, 96);
    g.strokeStyle = 'rgba(150,168,230,.25)'; g.lineWidth = 2;
    g.strokeRect(L, y, maxW, 96);
    g.fillStyle = '#8E9AC6';
    g.font = '400 26px "IBM Plex Sans KR", sans-serif';
    g.fillText(k, L+26, y+16);
    g.fillStyle = '#EAF0FF';
    g.font = '500 34px "IBM Plex Sans KR", sans-serif';
    g.fillText(v, L+26, y+50);
    y += 108;
  }

  y += 14;
  g.fillStyle = '#7C87B4';
  g.font = '400 25px "IBM Plex Mono", monospace';
  y = wrapText(g, '시각 표현 참고 · ' + x.keys.join(' · '), L, y, maxW, 38) + 16;

  if(S.artworkTitle){
    g.fillStyle = '#F5A8CF';
    g.font = '400 28px "IBM Plex Sans KR", sans-serif';
    g.fillText('작품 제목', L, y);
    g.fillStyle = '#FFFFFF';
    g.font = '700 46px "Gowun Batang", serif';
    y = wrapText(g, '「' + S.artworkTitle + '」', L, y + 42, maxW, 58);
  }

  g.fillStyle = '#9FAAD6';
  g.font = '400 30px "IBM Plex Sans KR", sans-serif';
  g.fillText(S.studentGrade + '학년 ' + (S.studentClass||'○') + '반 ' + (S.studentNumber||'○') + '번  ' + (S.studentName||''), L, H-140);
  g.fillStyle = '#5E6894';
  g.font = '400 24px "IBM Plex Mono", monospace';
  g.fillText('AI로 만드는 나만의 우주 · 중학교 과학', L, H-96);

  return cv.toDataURL('image/png');
}
async function showCard(){
  const ov = el('div','overlay');
  const box = el('div','box');

/* 별 배경 */
(function sky(){
  const cv = document.getElementById('stars');
  const g = cv.getContext('2d');
  let stars = [], w = 0, h = 0, raf = null;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function build(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    g.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(130, Math.round(w * h / 11000));
    stars = [];
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.3+0.3,
        a:Math.random()*0.6+0.25, s:Math.random()*0.012+0.004, p:Math.random()*Math.PI*2});
    }
  }
  let last = 0;
  function frame(t){
    raf = requestAnimationFrame(frame);
    if(t - last < 55) return;
    last = t;
    g.clearRect(0,0,w,h);
    for(const s of stars){
      s.p += s.s;
      const a = s.a + Math.sin(s.p) * 0.25;
      g.globalAlpha = Math.max(0.06, Math.min(1, a));
      g.fillStyle = '#EEF2FF';
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
  }
  function still(){
    g.clearRect(0,0,w,h);
    for(const s of stars){
      g.globalAlpha = s.a; g.fillStyle = '#EEF2FF';
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
  }
  function start(){
    build();
    if(raf) cancelAnimationFrame(raf);
    if(reduce) still(); else raf = requestAnimationFrame(frame);
  }
  let to;
  window.addEventListener('resize', ()=>{ clearTimeout(to); to = setTimeout(start, 250); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
    else if(!reduce && !raf){ raf = requestAnimationFrame(frame); }
  });
  start();
})();
